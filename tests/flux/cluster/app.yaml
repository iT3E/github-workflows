---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: example-app
  namespace: flux-system
spec:
  interval: 30m
  path: ./tests/flux/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: example
  postBuild:
    substitute:
      EXAMPLE_GREETING: hello
