kind: Fixed
body: 'release.yaml finishes a half-made release by itself. Every run tags, builds and publishes what the two newest versions on main still lack, so a run that died after its commit push (a rejected tag push, an API error) needs no hand work: the next run, a re-run or a dispatch on main finishes it. The tag push retries with a backoff and never moves a tag, the build is dispatched only when the tag has no run of it, the GitHub Release comes last, and the API calls use curl instead of the gh CLI. auto-fragment counts bot commits from the last release commit instead of the last tag, so a release whose tag is missing does not ship them twice. build-workflow must be a workflow file name or a numeric workflow id (a display name now fails), and the job needs curl and python3 instead of gh'
