kind: Changed
body: 'privacy.yaml and secret-scan.yaml: when the PR author or the actor of the event is not the repository owner or Renovate, the checks read their files from the default branch. The privacy check runs bin/privacy-check and .github/privacy-allow of the default branch and fails a new privacy:allow marker. The secret scan reads the config and the ignore files of the default branch and fails a new allow marker. The privacy check now reads the PR body of each author but Renovate, a GitHub App''s too, and a push of a new branch checks (and scans) each commit it adds to the default branch. For such an author or actor, a PR to a base that is not the default branch fails, a missing default branch fails, a marker counts in any commit of the branch, not only in its tree, and no config file of the branch stays in the folder of the scan. Tests: tests/privacy/test_workflow_steps.py.'
time: 2026-11-21T11:00:00.000000+00:00
