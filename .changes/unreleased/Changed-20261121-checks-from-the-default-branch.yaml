kind: Changed
body: 'privacy.yaml and secret-scan.yaml: when the PR author or the actor of the event is not the repository owner or Renovate, the checks read their files from the default branch. The privacy check runs bin/privacy-check and .github/privacy-allow of the default branch and fails a new privacy:allow marker. The secret scan reads the config and the ignore files of the default branch and fails a new allow marker. The privacy check now reads the PR body of each author but Renovate, a GitHub App''s too, and a push of a new branch checks what it adds to the default branch. Tests: tests/privacy/test_workflow_steps.py.'
