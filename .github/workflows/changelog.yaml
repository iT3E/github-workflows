---
name: "Changelog"

# Reusable (workflow_call): every PR adds a Changie fragment (`changie new`,
# under .changes/unreleased/), unless it carries skip-label, comes from a
# dependency bot, or changes only exempt-paths. One job, "changelog". The
# caller triggers on pull_request types opened, synchronize, reopened,
# labeled and unlabeled, so adding the label re-runs it.
on:
  workflow_call:
    inputs:
      skip-label:
        description: "PR label that waives the fragment."
        type: string
        default: "skip-changelog"
      exempt-paths:
        description: "Paths (one per line: a file, a directory or a glob, no :(magic)) a PR may change without a fragment. A PR that changes nothing else needs none. Empty: every PR needs one."
        type: string
        default: ""
      changie-version:
        description: "Changie release."
        type: string
        # renovate: datasource=github-releases depName=miniscruff/changie
        default: "v1.26.0"
      runs-on:
        description: "Runner label for every job."
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Timeout for each job, in minutes."
        type: number
        default: 5

permissions: {}

jobs:
  changelog:
    name: changelog
    if: >-
      !contains(github.event.pull_request.labels.*.name, inputs.skip-label) &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fragment required?
        id: need
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXEMPT_PATHS: ${{ inputs.exempt-paths }}
        run: |
          excludes=()
          while IFS= read -r p; do
            if [ -n "$p" ]; then excludes+=(":(exclude)$p"); fi
          done <<< "$EXEMPT_PATHS"
          if [ "${#excludes[@]}" -gt 0 ] \
            && [ -n "$(git diff --name-only "$BASE_SHA"...HEAD)" ] \
            && [ -z "$(git diff --name-only "$BASE_SHA"...HEAD -- . "${excludes[@]}")" ]; then
            echo "Every changed file is in exempt-paths; no fragment needed."
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fragment present
        if: steps.need.outputs.required == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKIP_LABEL: ${{ inputs.skip-label }}
        run: |
          added="$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- '.changes/unreleased/*.yaml')"
          if [ -z "$added" ]; then
            echo "::error::No Changie fragment. Run 'changie new' and commit the file under .changes/unreleased/, or label the PR ${SKIP_LABEL}."
            exit 1
          fi
          echo "Fragments:"; echo "$added"

      - name: Fragments are valid
        if: steps.need.outputs.required == 'true'
        uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # v3.0.1
        with:
          version: ${{ inputs.changie-version }}
          args: batch auto --dry-run
