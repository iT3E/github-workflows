---
name: "Secret Scan"

# Reusable (workflow_call): betterleaks over only the commits a PR adds (or a
# push to main), with the caller's config file. One job, "betterleaks". The
# server-side twin of the pre-commit hook: it runs whether or not the
# committer installed hooks.
on:
  workflow_call:
    inputs:
      config:
        description: "betterleaks config, relative to the repo root."
        type: string
        default: ".betterleaks.toml"
      betterleaks-version:
        description: "betterleaks release (container tag)."
        type: string
        # renovate: datasource=github-releases depName=betterleaks/betterleaks
        default: "v1.9.0"

permissions: {}

jobs:
  betterleaks:
    name: betterleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "log_opts=--no-merges ${BASE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "log_opts=-1" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=${BEFORE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
          CONFIG: ${{ inputs.config }}
          BETTERLEAKS_VERSION: ${{ inputs.betterleaks-version }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/repo:ro \
            "ghcr.io/betterleaks/betterleaks:${BETTERLEAKS_VERSION}" \
            git /repo --config "/repo/${CONFIG}" --redact --no-banner \
            --log-opts="$LOG_OPTS"
