---
name: "Secret Scan"

# Reusable (workflow_call): betterleaks over only the commits a PR adds (or a
# push to main), with the caller's config file. One job, "betterleaks". The
# server-side twin of the pre-commit hook: it runs whether or not the
# committer installed hooks.
#
# No Docker: the job runs the release binary, checked against the release's
# checksums, so a self-hosted runner without Docker runs it too.
#
# The config of the default branch: when the author of the PR or the actor
# of the event is not the repository owner or Renovate, the branch could
# change what the scan finds. Then the scan reads the config and the ignore
# files (.betterleaksignore, .gitleaksignore) of the default branch, and a
# line that the branch adds with an allow marker (betterleaks:allow or
# gitleaks:allow) fails the job. The owner and Renovate scan with the files
# of the branch, as before.
on:
  workflow_call:
    inputs:
      config:
        description: "betterleaks config, relative to the repo root."
        type: string
        default: ".betterleaks.toml"
      betterleaks-version:
        description: "betterleaks release tag, with or without the v."
        type: string
        # renovate: datasource=github-releases depName=betterleaks/betterleaks
        default: "v1.10.1"
      runs-on:
        description: "Runner label for every job."
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Timeout for each job, in minutes."
        type: number
        default: 10

permissions: {}

jobs:
  betterleaks:
    name: betterleaks
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "log_opts=--no-merges ${BASE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "log_opts=-1" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=${BEFORE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Config of the default branch
        id: config
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OWNER: ${{ github.repository_owner }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          CONFIG: ${{ inputs.config }}
        run: |
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "pull_request_target" ]; then
            main_ref="${BASE_SHA}"
            people="${AUTHOR} ${ACTOR}"
          else
            main_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
            git rev-parse -q --verify "$main_ref" >/dev/null || main_ref=HEAD
            people="${ACTOR}"
          fi
          trusted=true
          for person in $people; do
            [ "$person" = "$OWNER" ] || [ "$person" = "renovate[bot]" ] || trusted=false
          done
          if [ "$trusted" = true ]; then
            echo "config=${CONFIG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Not the owner or Renovate: the config and the ignore files of ${main_ref} scan this branch."
          if git cat-file -e "${main_ref}:${CONFIG}" 2>/dev/null; then
            git show "${main_ref}:${CONFIG}" > "${RUNNER_TEMP}/betterleaks.toml"
            echo "config=${RUNNER_TEMP}/betterleaks.toml" >> "$GITHUB_OUTPUT"
          else
            # No config on the default branch: the default rules of betterleaks.
            echo "config=" >> "$GITHUB_OUTPUT"
          fi
          for f in .betterleaksignore .gitleaksignore; do
            if git cat-file -e "${main_ref}:${f}" 2>/dev/null; then
              git show "${main_ref}:${f}" > "${f}"
            else
              rm -f "${f}"
            fi
          done
          if git diff --no-color --no-ext-diff -U0 "${main_ref}...HEAD" -- . |
              grep -a -v '^+++ ' | grep -a '^+' | grep -a -q -E '(betterleaks|gitleaks):allow'; then
            echo "::error::the branch adds a line with an allow marker of the scan; an exception is the owner's"
            exit 1
          fi

      - name: Install betterleaks
        env:
          BETTERLEAKS_VERSION: ${{ inputs.betterleaks-version }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=x64 ;;
            aarch64) arch=arm64 ;;
            *) echo "::error::unsupported machine $(uname -m)"; exit 1 ;;
          esac
          v="${BETTERLEAKS_VERSION#v}"
          f="betterleaks_${v}_linux_${arch}.tar.gz"
          base="https://github.com/betterleaks/betterleaks/releases/download/v${v}"
          dir="${RUNNER_TEMP}/betterleaks"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL --retry 3 -o "$f" "${base}/${f}"
          curl -fsSL --retry 3 -o checksums.txt "${base}/checksums.txt"
          # No line for the file fails the check, as a wrong sum does.
          awk -v f="$f" '$2 == f' checksums.txt | sha256sum -c -
          tar -xzf "$f" betterleaks
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
          CONFIG: ${{ steps.config.outputs.config }}
        run: |
          config=()
          if [ -n "${CONFIG}" ]; then config=(--config "${CONFIG}"); fi
          betterleaks git . "${config[@]}" --redact --no-banner \
            --log-opts="$LOG_OPTS"
