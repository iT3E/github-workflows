---
name: "Self: Release"

# This repo's own use of the reusable workflow next to it (a local path, so
# a PR runs the version it changes).
# Releasing: merge a PR with a Changie fragment, and this tags vX.Y.Z
# (README "Releasing"). The first release is v1.0.0: the interface was
# already in use (as app-template v0.2.1) when it moved here. No image, so
# nothing is dispatched.
#
# Renovate PRs carry no fragment. When one changes what callers pin (the
# reusable workflows, not the self-* ones, or the presets in renovate/),
# auto-fragment adds a Fixed "Dependency updates" fragment and it releases
# on its own, so the bump flows to app-repo-template and on to the app
# repos. A Renovate PR that only touches this repo's own CI, hooks or
# Taskfile releases nothing. Every push to main runs it (the reusable
# workflow decides), and it can be run by hand with a note.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto follows the fragment kinds)"
        type: choice
        default: auto
        options: [auto, patch, minor, major]
      note:
        description: "Release note to add as a fragment (empty: none)"
        type: string
        default: ""
      kind:
        description: "Kind of that fragment"
        type: choice
        default: Fixed
        options: [Fixed, Security, Changed, Added]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/release.yaml
    with:
      bump: ${{ inputs.bump || 'auto' }}
      first-version: v1.0.0
      build-workflow: ""
      fragment-kind: ${{ inputs.kind || 'Fixed' }}
      fragment-body: ${{ inputs.note || '' }}
      auto-fragment: "Dependency updates"
      ship-paths: |
        .github/workflows
        renovate
        :(exclude).github/workflows/self-*
