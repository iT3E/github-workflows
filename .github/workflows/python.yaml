---
name: "Python"

# Reusable (workflow_call): the host-side Python checks. One job, "check":
# python -m compileall (every file must parse; needs no dependencies), then
# ruff check and/or ruff format --check when enabled, then test-command if
# set. Repos whose tests need the built image run them in image.yaml's
# test-command instead.
#
# uv: true sets Python up with uv instead of setup-python: an activated
# .venv (python on PATH, no pip), `uv sync --locked` when working-directory
# has a uv.lock, and uv's cache (saved from the default branch only).
on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for setup-python."
        type: string
        default: "3.12"
      working-directory:
        description: "Directory the checks run in."
        type: string
        default: "."
      uv:
        description: "Set Python up with uv (activated .venv, uv sync --locked when there is a uv.lock) instead of setup-python."
        type: boolean
        default: false
      ruff-check:
        description: "Run ruff check (the repo's ruff config)."
        type: boolean
        default: false
      ruff-format:
        description: "Run ruff format --check."
        type: boolean
        default: false
      ruff-version:
        description: "ruff version from PyPI."
        type: string
        # renovate: datasource=pypi depName=ruff
        default: "0.17.5"
      test-command:
        description: "Test command (bash, in working-directory). Empty: none."
        type: string
        default: ""
      runs-on:
        description: "Runner label for every job."
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Timeout for each job, in minutes."
        type: number
        default: 30

permissions: {}

jobs:
  check:
    name: check
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        if: ${{ !inputs.uv }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        if: inputs.uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
          activate-environment: true
          working-directory: ${{ inputs.working-directory }}
          enable-cache: true
          save-cache: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          prune-cache: true

      - name: uv sync
        if: inputs.uv && hashFiles(format('{0}/uv.lock', inputs.working-directory)) != ''
        run: uv sync --locked

      - name: compileall
        run: python -m compileall -q -x '/(\.git|\.venv|node_modules)/' .

      - name: Install ruff
        if: inputs.ruff-check || inputs.ruff-format
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
          UV: ${{ inputs.uv }}
        run: |
          if [ "$UV" = true ]; then
            uv tool install "ruff==${RUFF_VERSION}"
          else
            python -m pip install --disable-pip-version-check "ruff==${RUFF_VERSION}"
          fi

      - name: ruff check
        if: inputs.ruff-check
        run: ruff check --output-format=github .

      - name: ruff format
        if: inputs.ruff-format
        run: ruff format --check --diff .

      - name: Tests
        if: inputs.test-command != ''
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          printf '%s\n' "$TEST_COMMAND" > "$RUNNER_TEMP/test.sh"
          bash -euo pipefail "$RUNNER_TEMP/test.sh"
