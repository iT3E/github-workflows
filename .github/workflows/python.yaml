---
name: "Python"

# Reusable (workflow_call): the host-side Python checks. One job, "check":
# python -m compileall (every file must parse; needs no dependencies), then
# ruff check and/or ruff format --check when enabled, then test-command if
# set. Repos whose tests need the built image run them in image.yaml's
# test-command instead.
on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for setup-python."
        type: string
        default: "3.12"
      working-directory:
        description: "Directory the checks run in."
        type: string
        default: "."
      ruff-check:
        description: "Run ruff check (the repo's ruff config)."
        type: boolean
        default: false
      ruff-format:
        description: "Run ruff format --check."
        type: boolean
        default: false
      ruff-version:
        description: "ruff version from PyPI."
        type: string
        # renovate: datasource=pypi depName=ruff
        default: "0.17.3"
      test-command:
        description: "Test command (bash, in working-directory). Empty: none."
        type: string
        default: ""

permissions: {}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: compileall
        run: python -m compileall -q -x '/(\.git|\.venv|node_modules)/' .

      - name: Install ruff
        if: inputs.ruff-check || inputs.ruff-format
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: python -m pip install --disable-pip-version-check "ruff==${RUFF_VERSION}"

      - name: ruff check
        if: inputs.ruff-check
        run: ruff check --output-format=github .

      - name: ruff format
        if: inputs.ruff-format
        run: ruff format --check --diff .

      - name: Tests
        if: inputs.test-command != ''
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          printf '%s\n' "$TEST_COMMAND" > "$RUNNER_TEMP/test.sh"
          bash -euo pipefail "$RUNNER_TEMP/test.sh"
