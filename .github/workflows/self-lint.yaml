---
name: "Self: Lint"

# The repo's own lint, on every PR and push to main:
#   lint      yamllint; shellcheck on bin/* and the actions' scripts; every
#             reusable workflow is workflow_call only, starts from
#             permissions: {}, and pins third-party actions to a commit
#             SHA, and so does every composite action in actions/. Every job
#             that runs steps has timeout-minutes, and a reusable workflow's
#             jobs take runs-on and timeout-minutes from its inputs.
#   zizmor    zizmor.yaml (this repo's reusable one) on every workflow and
#             action (.github/zizmor.yml).
#   renovate  renovate-config-validator on the presets in renovate/ and
#             this repo's .github/renovate.json5, as repo configs.
on:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

env:
  # renovate: datasource=pypi depName=yamllint
  YAMLLINT_VERSION: "1.38.0"
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "44.222.2"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: yamllint
        run: |
          pipx run "yamllint==${YAMLLINT_VERSION}" -c .yamllint.yaml \
            .github actions tests/flux .yamllint.yaml .changie.yaml .pre-commit-config.yaml Taskfile.yml

      - name: shellcheck
        run: shellcheck bin/* actions/setup-flate/flate-guard

      # The files app repos call: everything in .github/workflows/ except
      # this repo's own self-*.yaml.
      - name: Reusable workflows
        run: |
          rc=0
          for f in .github/workflows/*.yaml; do
            case "$(basename "$f")" in self-*) continue ;; esac
            if ! grep -q '^  workflow_call:' "$f" || [ "$(grep -cE '^  [a-z_]+:' <(sed -n '/^on:/,/^[a-z]/p' "$f"))" -ne 1 ]; then
              echo "::error file=$f::a reusable workflow has exactly one trigger, workflow_call"; rc=1
            fi
            if ! grep -qx 'permissions: {}' "$f"; then
              echo "::error file=$f::a reusable workflow starts from permissions: {}"; rc=1
            fi
            if grep -nE '^\s*(- )?uses: [^.][^@]*(@[^ ]*)?\s*(#.*)?$' "$f" | grep -vE 'uses: [^@ ]+@[0-9a-f]{40} # v' ; then
              echo "::error file=$f::actions must be pinned as @<40-hex sha> # vX.Y.Z"; rc=1
            fi
          done
          for f in actions/*/action.yml; do
            if grep -nE '^\s*(- )?uses: [^.][^@]*(@[^ ]*)?\s*(#.*)?$' "$f" | grep -vE 'uses: [^@ ]+@[0-9a-f]{40} # v' ; then
              echo "::error file=$f::actions must be pinned as @<40-hex sha> # vX.Y.Z"; rc=1
            fi
          done
          exit "$rc"

      # A job with runs-on runs steps (a job that calls a workflow can't
      # take either key).
      - name: Timeouts and runners
        run: |
          # Split so Actions doesn't expand them here.
          want_runner='$''{{ inputs.runs-on }}'
          want_timeout='$''{{ inputs.timeout-minutes }}'
          rc=0
          for f in .github/workflows/*.yaml; do
            jobs="$(yq -o=json '.jobs // {} | to_entries | map(select(.value["runs-on"] != null)) | map({"n": .key, "r": .value["runs-on"], "t": .value["timeout-minutes"]})' "$f")"
            while IFS=$'\t' read -r job runner timeout; do
              [ -z "$job" ] && continue
              if [ "$timeout" = null ]; then
                echo "::error file=$f::job $job has no timeout-minutes"; rc=1
              fi
              case "$(basename "$f")" in
                self-*) ;;
                *)
                  if [ "$runner" != "$want_runner" ] || [ "$timeout" != "$want_timeout" ]; then
                    echo "::error file=$f::job $job takes runs-on and timeout-minutes from its inputs"; rc=1
                  fi
                  ;;
              esac
            done < <(jq -r '.[] | [.n, (.r | tostring), (.t | tostring)] | @tsv' <<<"$jobs")
          done
          exit "$rc"

  zizmor:
    name: zizmor
    permissions:
      contents: read
    uses: ./.github/workflows/zizmor.yaml
    with:
      runs-on: ubuntu-26.04

  renovate:
    name: renovate-config
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: renovate-config-validator
        run: |
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict --no-global \
            renovate/*.json5 .github/renovate.json5
