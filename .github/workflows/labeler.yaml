---
name: "Labeler"

# Reusable (workflow_call): area/* labels on a PR from the paths it changes
# (actions/labeler, the caller's config). One job, "labeler". The caller
# grants pull-requests: write.
on:
  workflow_call:
    inputs:
      configuration-path:
        description: "Labeler config in the caller repo."
        type: string
        default: ".github/labeler.yaml"
      runs-on:
        description: "Runner label for every job."
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Timeout for each job, in minutes."
        type: number
        default: 5

permissions: {}

jobs:
  labeler:
    name: labeler
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: ${{ inputs.configuration-path }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
