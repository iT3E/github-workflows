---
name: "Image"

# Reusable (workflow_call): build the repo's Docker image, optionally test
# it, and push it to GHCR on main and/or v* tags. One job, "image".
#
# What is pushed (the tags tnwks-ops pins; metadata-action runs with
# latest=false, so never :latest):
#   pull_request          build only (pr-<n> stays a local tag)
#   push to main          :main and :sha-<short>, if push-main is true;
#                         else build only
#   v* tag                :<version> and :sha-<short>
#   workflow_dispatch     same as the ref it runs on (release.yaml dispatches
#                         the caller's build workflow on the new tag)
#
# Before anything is pushed the caller's bin/privacy-check runs on the exact
# tree (privacy-gate: tree) or on the whole history it ships (history), with
# the caller's PRIVACY_TERMS secret. A missing secret fails the push.
#
# test-command runs against a local build before the push; $IMAGE_REF is its
# tag. With postgres: true a throwaway Postgres (trust auth, user and
# database postgres) runs as a service on 127.0.0.1:5432, and
# $TEST_POSTGRES_URL points at it; containers reach it with --network host. Build args VERSION (the metadata version: 1.2.3, main or pr-<n>) and
# REVISION (the commit) are always passed, plus build-args.
on:
  workflow_call:
    inputs:
      image:
        description: "Image name. Empty: ghcr.io/<owner>/<repo>, lowercased."
        type: string
        default: ""
      context:
        description: "Docker build context."
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile path, relative to the repo root."
        type: string
        default: "Dockerfile"
      platforms:
        description: "Target platforms (comma-separated). Empty: the runner's."
        type: string
        default: ""
      build-args:
        description: "Extra build args, one KEY=value per line."
        type: string
        default: ""
      push-main:
        description: "Push :main and :sha-<short> on pushes to main. False: only v* tags push."
        type: boolean
        default: true
      privacy-gate:
        description: "What bin/privacy-check covers before a push: tree, or history (every commit the tag ships)."
        type: string
        default: "tree"
      test-command:
        description: "Bash run against the locally built image ($IMAGE_REF) before any push. Empty: none."
        type: string
        default: ""
      postgres:
        description: "Start a throwaway Postgres for test-command ($TEST_POSTGRES_URL)."
        type: boolean
        default: false
      postgres-version:
        description: "Postgres image tag for postgres: true."
        type: string
        # renovate: datasource=docker depName=postgres
        default: "18"
    secrets:
      PRIVACY_TERMS:
        description: "The privacy denylist (tnwks-ops), needed only for a push."
        required: false
    outputs:
      digest:
        description: "Digest of the pushed image (empty if nothing was pushed)."
        value: ${{ jobs.image.outputs.digest }}

permissions: {}

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    services:
      postgres:
        # An empty image starts no service (postgres: false).
        image: ${{ inputs.postgres && format('postgres:{0}', inputs.postgres-version) || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the history gate reads every commit
          fetch-depth: ${{ inputs.privacy-gate == 'history' && '0' || '1' }}
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          IMAGE: ${{ inputs.image }}
          PUSH_MAIN: ${{ inputs.push-main }}
          GATE: ${{ inputs.privacy-gate }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          case "$GATE" in
            tree | history) ;;
            *) echo "::error::privacy-gate must be tree or history, not '$GATE'"; exit 1 ;;
          esac
          image="${IMAGE:-ghcr.io/${GITHUB_REPOSITORY}}"
          image="${image,,}"
          push=false
          if [ "$EVENT" != "pull_request" ]; then
            if [ "$REF_TYPE" = "tag" ] && [[ "$REF" == refs/tags/v* ]]; then
              push=true
            elif [ "$REF" = "refs/heads/main" ] && [ "$PUSH_MAIN" = "true" ]; then
              push=true
            fi
          fi
          {
            echo "image=$image"
            echo "local=${image##*/}:ci"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"
          echo "Image $image, push: $push"

      # The image is public. PRs are checked by privacy.yaml; this re-checks
      # what is about to ship.
      - name: Privacy gate
        if: steps.plan.outputs.push == 'true'
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
          GATE: ${{ inputs.privacy-gate }}
        run: |
          if [ -z "${PRIVACY_TERMS}" ]; then
            echo "::error::PRIVACY_TERMS is not available to this run (pass it in the caller's secrets:)"
            exit 1
          fi
          if [ "$GATE" = "history" ]; then
            bin/privacy-check --commits HEAD
          else
            bin/privacy-check
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.plan.outputs.push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.plan.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,enable=${{ inputs.push-main }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build (local, for the tests)
        if: inputs.test-command != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          load: true
          push: false
          tags: ${{ steps.plan.outputs.local }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the image
        if: inputs.test-command != ''
        env:
          IMAGE_REF: ${{ steps.plan.outputs.local }}
          TEST_POSTGRES_URL: ${{ inputs.postgres && 'postgresql://postgres@127.0.0.1:5432/postgres?sslmode=disable' || '' }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          printf '%s\n' "$TEST_COMMAND" > "$RUNNER_TEMP/image-test.sh"
          bash -euo pipefail "$RUNNER_TEMP/image-test.sh"

      # Without a test-command this is also the PR build. With one, the local
      # build above already covered the PR, and this reuses its cache.
      - name: Build and push
        id: push
        if: steps.plan.outputs.push == 'true' || inputs.test-command == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ steps.plan.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: steps.plan.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "${TAGS}"
            echo "digest: ${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
