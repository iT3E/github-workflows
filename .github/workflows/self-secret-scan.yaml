---
name: "Self: Secret Scan"

# This repo's own use of the reusable workflow next to it (a local path, so
# a PR runs the version it changes).
on:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

jobs:
  betterleaks:
    name: betterleaks
    permissions:
      contents: read
    uses: ./.github/workflows/secret-scan.yaml
