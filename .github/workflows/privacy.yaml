---
name: "Privacy"

# Reusable (workflow_call): the denylist check (the caller's
# bin/privacy-check) on every tracked file and path, the commits the event
# adds (messages, author and committer identities), and the PR title and
# body. One job, "privacy".
#
# The list is the caller's PRIVACY_TERMS secret, copied from tnwks-ops
# (`task privacy:sync` in the caller), as the plain list or its opaque
# one-line form. Hits print as "hit: path:line", without the matched text
# or which term. Comments and reviews are privacy-text.yaml.
# Exceptions: the caller's .github/privacy-allow (files only).
#
# Commit range: a PR checks base..head; a push checks before..HEAD (a new
# branch: the default branch..HEAD, or HEAD~1..HEAD with no default branch
# to compare); a v* tag checks the whole history it ships.
#
# The checker of the default branch: when the author of the PR or the
# actor of the event is not the repository owner or Renovate, the branch
# could change what checks it. Then the job runs bin/privacy-check and
# .github/privacy-allow of the default branch on the files and commits of
# the branch, and fails a line that the branch adds with the
# "privacy:allow" marker (an exception is the owner's), in any commit of
# the branch or in its tree. Such a PR must have the default branch as its
# base: a green check against another base could stay on the head after
# a change of the base. The owner and Renovate run the checker of the
# branch, as before.
on:
  workflow_call:
    inputs:
      allow-missing-terms:
        description: "Warn and pass when PRIVACY_TERMS is missing (fork PRs on a public repo). Default: fail."
        type: boolean
        default: false
      runs-on:
        description: "Runner label for every job."
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Timeout for each job, in minutes."
        type: number
        default: 5
    secrets:
      PRIVACY_TERMS:
        required: false

permissions: {}

jobs:
  privacy:
    name: privacy
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
          ALLOW_MISSING: ${{ inputs.allow-missing-terms }}
          # Renovate's PR body is third-party text (its release notes name
          # upstream contributors), so only its title counts. The body of
          # every other author counts, a GitHub App's too.
          PRIVACY_EXTRA_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.user.login != 'renovate[bot]' && github.event.pull_request.body || '' }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          OWNER: ${{ github.repository_owner }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "${PRIVACY_TERMS}" ]; then
            if [ "$ALLOW_MISSING" = "true" ]; then
              echo "::warning::PRIVACY_TERMS is not available to this run; skipped"
              exit 0
            fi
            echo "::error::PRIVACY_TERMS is not available to this run"
            exit 1
          fi
          default="refs/remotes/origin/${DEFAULT_BRANCH}"
          git rev-parse -q --verify "$default" >/dev/null || default=""
          pr=false
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "pull_request_target" ]; then
            pr=true
            range="${BASE_SHA}..${HEAD_SHA}"
            people="${AUTHOR} ${ACTOR}"
          else
            if [ "$REF_TYPE" = "tag" ]; then
              # A tag push has no useful "before"; check the whole history it ships.
              range="HEAD"
            elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              # A new branch: what it adds to the default branch, else its
              # tip commit (or the root commit of a new repo).
              if [ -n "$default" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
                range="${default}..HEAD"
              elif git rev-parse -q --verify HEAD~1 >/dev/null; then
                range="HEAD~1..HEAD"
              else
                range="HEAD"
              fi
            else
              range="${BEFORE_SHA}..HEAD"
            fi
            people="${ACTOR}"
          fi
          trusted=true
          for person in $people; do
            [ "$person" = "$OWNER" ] || [ "$person" = "renovate[bot]" ] || trusted=false
          done
          checker=bin/privacy-check
          marker=0
          if [ "$trusted" != true ]; then
            if [ -z "$default" ]; then
              echo "::error::no ${DEFAULT_BRANCH} branch to read the checker from"
              exit 1
            fi
            if [ "$pr" = true ] && [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
              echo "::error::the base of this PR is not ${DEFAULT_BRANCH}; change the base to ${DEFAULT_BRANCH} and push again"
              exit 1
            fi
            main_ref="$default"
            echo "Not the owner or Renovate: the checker and the allow file of ${main_ref} check this branch."
            if ! git show "${main_ref}:bin/privacy-check" > "${RUNNER_TEMP}/privacy-check"; then
              echo "::error::no bin/privacy-check on ${main_ref}"
              exit 1
            fi
            chmod +x "${RUNNER_TEMP}/privacy-check"
            checker="${RUNNER_TEMP}/privacy-check"
            mkdir -p .github
            if git cat-file -e "${main_ref}:.github/privacy-allow" 2>/dev/null; then
              git show "${main_ref}:.github/privacy-allow" > .github/privacy-allow
            else
              rm -f .github/privacy-allow
            fi
            # An attributes file of the branch ("* -diff") would show each file as
            # binary to git, so to the marker search and to the scan. The info file
            # of the clone wins over it and gives each path the default of git.
            info="$(git rev-parse --git-path info)"
            mkdir -p "$info"
            printf '* !diff\n' >> "$info/attributes"
            # Each commit of the branch, and its tree: a marker that a later
            # commit deletes still hides a line of an earlier one.
            if { git log -p --no-merges --no-color --no-ext-diff -U0 --format= "${main_ref}..HEAD" -- .
                 git diff --no-color --no-ext-diff -U0 "${main_ref}...HEAD" -- .; } |
                grep -a -v '^+++ ' | grep -a '^+' | grep -a -F 'privacy:allow' >/dev/null; then
              echo "::error::the branch adds a line with the privacy:allow marker; an exception is the owner's"
              marker=1
            fi
          fi
          rc=0
          "$checker" --commits "$range" || rc=$?
          if [ "$rc" -eq 0 ] && [ "$marker" -ne 0 ]; then rc=1; fi
          exit "$rc"
