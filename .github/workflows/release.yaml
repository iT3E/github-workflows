---
name: "Release"

# Reusable (workflow_call): cut a release from the Changie fragments on main.
# One job, "release":
#   1. batch .changes/unreleased/ into .changes/<version>.md and CHANGELOG.md
#   2. commit "chore(release): <version>" and push it to main (rebasing onto
#      a moved main, up to 5 tries), then tag it (annotated) and push the tag
#   3. publish a GitHub Release with the version's notes
#   4. if build-workflow is set, dispatch it on the tag: a tag pushed with
#      GITHUB_TOKEN triggers no workflow, so this is how the tag's image gets
#      built
# Nothing happens when there are no fragments.
#
# fragment-body adds one more fragment (of fragment-kind) before step 1, for
# a release no PR wrote a fragment for: app-repo-template passes one when a
# Renovate PR moved its github-workflows pin, so the bump ships as a
# template release.
#
# auto-fragment releases what dependency bots merged. When no fragment is
# pending, and a commit since the last v* tag was authored by renovate[bot]
# or dependabot[bot] and changed a file in ship-paths, it adds one
# auto-fragment-kind fragment: "<auto-fragment>: <their subjects>". Bot PRs
# carry no fragment (changelog.yaml waives it), so without this their
# updates never ship. A person's commit never triggers it: a human PR
# brings its own fragment. ship-paths are git pathspecs for what the repo
# ships (the image, or the files consumers pin); the default is every path
# except the repo tooling app-repo-template manages and the docs, so a
# template update or a CI-only bump releases nothing. The check covers every
# commit since the last tag, not just the pushed one, so a release run that
# concurrency dropped (only one waits) is caught up by the next.
#
# The version is changie's next for bump (auto: the highest fragment kind),
# or first-version while .changes/ has no v*.md yet.
#
# The caller triggers on pushes to main (every path when auto-fragment is
# set, else those touching .changes/unreleased/**) and on
# workflow_dispatch, runs one release at a time (concurrency), and grants
# contents: write and actions: write. GITHUB_TOKEN can push the release
# commit only while main has no ruleset that blocks it. When one does, set
# app-client-id and pass RELEASE_APP_PRIVATE_KEY: a GitHub App the ruleset
# lets bypass it then pushes the commit and tag and publishes the release,
# with a token scoped to contents: write on the calling repo.
on:
  workflow_call:
    inputs:
      bump:
        description: "auto, patch, minor or major."
        type: string
        default: "auto"
      first-version:
        description: "The first release, when no .changes/v*.md exists yet."
        type: string
        default: "v0.1.0"
      build-workflow:
        description: "Caller workflow file to dispatch on the new tag. Empty: none."
        type: string
        default: "build.yaml"
      changie-version:
        description: "Changie release."
        type: string
        # renovate: datasource=github-releases depName=miniscruff/changie
        default: "v1.26.0"
      fragment-kind:
        description: "Kind of the fragment-body fragment (a kind in the caller's .changie.yaml)."
        type: string
        default: "Changed"
      fragment-body:
        description: "Add a fragment with this text before releasing. Empty: none."
        type: string
        default: ""
      auto-fragment:
        description: "Text of the fragment added when bot commits since the last tag changed ship-paths and no fragment is pending. Empty: off."
        type: string
        default: ""
      auto-fragment-kind:
        description: "Kind of the auto-fragment fragment (a kind in the caller's .changie.yaml)."
        type: string
        default: "Fixed"
      ship-paths:
        description: "Git pathspecs (one per line) for what a release ships; auto-fragment looks only at these."
        type: string
        default: |
          .
          :(exclude).changes
          :(exclude).github
          :(exclude)*.md
          :(exclude).copier-answers.yml
          :(exclude).betterleaks.toml
          :(exclude).changie.yaml
          :(exclude).editorconfig
          :(exclude).gitattributes
          :(exclude).gitignore
          :(exclude).golangci.yml
          :(exclude).pre-commit-config.yaml
          :(exclude).yamllint.yaml
          :(exclude)Taskfile.yml
          :(exclude)bin/install-hooks
          :(exclude)bin/privacy-check
      app-client-id:
        description: "Client ID of a GitHub App that pushes the release (for a main behind a ruleset GITHUB_TOKEN can't bypass); needs secret RELEASE_APP_PRIVATE_KEY. Empty: GITHUB_TOKEN pushes."
        type: string
        default: ""
      runs-on:
        description: "Runner label for every job."
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Timeout for each job, in minutes."
        type: number
        default: 15
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: "Private key of the app-client-id GitHub App. Only with app-client-id."
        required: false
    outputs:
      version:
        description: "The released version, or empty when nothing was released."
        value: ${{ jobs.release.outputs.version }}

permissions: {}

jobs:
  release:
    name: release
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # push the release commit and tag, create the GitHub Release
      contents: write
      # dispatch build-workflow on the tag
      actions: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Release app token
        id: app-token
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The checkout's credentials are what git push uses below.
      - name: Checkout # zizmor: ignore[artipacked] git push below uses these credentials; nothing is uploaded
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      # A plain fragment file, as changie new writes it (kind, body, time).
      - name: Add fragment-body
        if: inputs.fragment-body != ''
        env:
          KIND: ${{ inputs.fragment-kind }}
          BODY: ${{ inputs.fragment-body }}
        run: |
          # Fail here, naming the input, rather than later in changie batch.
          if ! [[ "$KIND" =~ ^[A-Za-z]+$ ]] || ! grep -qE "^\s*- label: ${KIND}\s*$" .changie.yaml; then
            echo "::error::fragment-kind '$KIND' is not a kind in .changie.yaml"
            exit 1
          fi
          mkdir -p .changes/unreleased
          file=".changes/unreleased/${KIND}-$(date -u +%Y%m%d-%H%M%S).yaml"
          {
            echo "kind: ${KIND}"
            echo "body: |-"
            printf '%s\n' "$BODY" | sed 's/^/  /'
            echo "time: $(date -u +%Y-%m-%dT%H:%M:%S.000000000Z)"
          } > "$file"
          echo "Added $file:"; cat "$file"

      - name: Add auto-fragment
        if: inputs.auto-fragment != ''
        env:
          KIND: ${{ inputs.auto-fragment-kind }}
          BODY: ${{ inputs.auto-fragment }}
          SHIP_PATHS: ${{ inputs.ship-paths }}
        run: |
          if ! [[ "$KIND" =~ ^[A-Za-z]+$ ]] || ! grep -qE "^\s*- label: ${KIND}\s*$" .changie.yaml; then
            echo "::error::auto-fragment-kind '$KIND' is not a kind in .changie.yaml"
            exit 1
          fi
          if compgen -G ".changes/unreleased/*.yaml" > /dev/null; then
            echo "Fragments pending; they cover this release."
            exit 0
          fi
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [ -z "$last" ]; then
            echo "No release yet; the first one needs a fragment."
            exit 0
          fi
          paths=()
          while IFS= read -r p; do
            if [ -n "$p" ]; then paths+=("$p"); fi
          done <<< "$SHIP_PATHS"
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "::error::ship-paths is empty"
            exit 1
          fi
          subjects=()
          while IFS=$'\t' read -r sha author subject; do
            case "$author" in
              "renovate[bot]" | "dependabot[bot]") ;;
              *) continue ;;
            esac
            changed="$(git diff-tree --no-commit-id --name-only -r "$sha" -- "${paths[@]}")"
            if [ -n "$changed" ]; then
              echo "${sha:0:8} ships: $(echo "$changed" | paste -sd ' ')"
              subjects+=("$subject")
            else
              echo "${sha:0:8} ships nothing: ${subject}"
            fi
          done < <(git log --no-merges --reverse --format='%H%x09%an%x09%s' "${last}..HEAD")
          if [ "${#subjects[@]}" -eq 0 ]; then
            echo "No bot commit since ${last} changed ship-paths; nothing to release."
            exit 0
          fi
          note="${BODY}: $(printf '%s; ' "${subjects[@]}")"
          note="${note%; }"
          mkdir -p .changes/unreleased
          file=".changes/unreleased/${KIND}-auto-$(date -u +%Y%m%d-%H%M%S).yaml"
          {
            echo "kind: ${KIND}"
            echo "body: |-"
            printf '%s\n' "$note" | sed 's/^/  /'
            echo "time: $(date -u +%Y-%m-%dT%H:%M:%S.000000000Z)"
          } > "$file"
          echo "Added $file:"; cat "$file"

      - name: Pending fragments
        id: pending
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in
            auto | patch | minor | major) ;;
            *) echo "::error::bump must be auto, patch, minor or major, not '$BUMP'"; exit 1 ;;
          esac
          if compgen -G ".changes/unreleased/*.yaml" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No unreleased fragments; nothing to release."
          fi

      - name: Next version
        id: next-auto
        if: steps.pending.outputs.found == 'true'
        uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # v3.0.1
        with:
          version: ${{ inputs.changie-version }}
          args: next ${{ inputs.bump }}

      - name: Resolve version
        id: version
        if: steps.pending.outputs.found == 'true'
        env:
          NEXT: ${{ steps.next-auto.outputs.output }}
          FIRST_VERSION: ${{ inputs.first-version }}
        run: |
          if compgen -G ".changes/v*.md" > /dev/null; then
            version="$NEXT"
          else
            version="$FIRST_VERSION"
          fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected version '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Batch
        if: steps.pending.outputs.found == 'true'
        uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # v3.0.1
        with:
          version: ${{ inputs.changie-version }}
          args: batch ${{ steps.version.outputs.version }}

      - name: Merge into CHANGELOG.md
        if: steps.pending.outputs.found == 'true'
        uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # v3.0.1
        with:
          version: ${{ inputs.changie-version }}
          args: merge

      - name: Commit, tag, push
        if: steps.pending.outputs.found == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [ -n "$APP_SLUG" ]; then
            bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git add -A .changes CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          # main can move between checkout and push (another merge landing).
          # The release commit only touches .changes/ and CHANGELOG.md, so
          # rebase onto the new tip and retry; tag only what was pushed.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::main kept moving; giving up after $attempt attempts"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
          git tag -a "${VERSION}" -m "${VERSION}"
          git push origin "${VERSION}"

      - name: GitHub Release
        if: steps.pending.outputs.found == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          gh release create "${VERSION}" --title "${VERSION}" \
            --notes-file ".changes/${VERSION}.md" --verify-tag

      - name: Build for the tag
        if: steps.pending.outputs.found == 'true' && inputs.build-workflow != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_WORKFLOW: ${{ inputs.build-workflow }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "${BUILD_WORKFLOW}" --ref "${VERSION}"
          echo "Dispatched ${BUILD_WORKFLOW} on ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
